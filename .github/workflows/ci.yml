name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -e '.[gui,input-proxy]'
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: python -c 'import multiseat_arch.input_proxy; import multiseat_arch.gui'
      - name: Construct GUI headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from multiseat_arch.gui import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.close()
          app.processEvents()
          PY
      - run: bash -n scripts/*.sh
