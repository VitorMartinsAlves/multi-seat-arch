[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-seat-arch"
version = "0.8.0.dev24"
description = "ASTER-like visual single-GPU multiseat manager for Arch Linux/CachyOS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
input-proxy = ["evdev>=1.7"]

[project.scripts]
multi-seat-arch = "multiseat_arch.cli:main"
multi-seat-arch-gui = "multiseat_arch.gui_v4:main"
multi-seat-arch-input-proxy = "multiseat_arch.input_proxy:main"
multi-seat-arch-session = "multiseat_arch.session_shell:main"
multi-seat-arch-plasma-session = "multiseat_arch.plasma_session_v2:main"
multi-seat-arch-login-greeter = "multiseat_arch.display_manager_session_v2:greeter_main"
multi-seat-arch-login-plasma = "multiseat_arch.display_manager_session_v2:plasma_main"
multi-seat-arch-audio-session = "multiseat_arch.audio:apply_for_current_seat"
multi-seat-arch-audio-admin = "multiseat_arch.audio_admin:main"

[tool.setuptools.packages.find]
where = ["src"]
