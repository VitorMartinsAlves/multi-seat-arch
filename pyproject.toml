[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-seat-arch"
version = "0.2.0"
description = "Visual single-GPU multiseat manager for Arch Linux/CachyOS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.scripts]
multi-seat-arch = "multiseat_arch.cli:main"
multi-seat-arch-gui = "multiseat_arch.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
