[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-seat-arch"
version = "0.8.0.dev3"
description = "ASTER-like visual single-GPU multiseat manager for Arch Linux/CachyOS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
input-proxy = ["evdev>=1.7"]

[project.scripts]
multi-seat-arch = "multiseat_arch.cli:main"
multi-seat-arch-gui = "multiseat_arch.gui:main"
multi-seat-arch-input-proxy = "multiseat_arch.input_proxy:main"
multi-seat-arch-session = "multiseat_arch.session_shell:main"
multi-seat-arch-plasma-session = "multiseat_arch.plasma_session:main"

[tool.setuptools.packages.find]
where = ["src"]
