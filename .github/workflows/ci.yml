name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: pip install -e '.[gui,input-proxy]'
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: python -c 'import multiseat_arch.input_proxy; import multiseat_arch.gui_current; import multiseat_arch.display_manager_current; import multiseat_arch.plasma_session_current'
      - name: Construct GUI headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from multiseat_arch.gui_current import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.close()
          app.processEvents()
          PY
      - run: bash -n scripts/*.sh

  arch-smoke:
    name: Arch Linux smoke
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install target-platform test dependencies
        run: |
          pacman -Syu --noconfirm python python-pip libegl libxkbcommon git
          python -m pip install --break-system-packages -e '.[gui,input-proxy]'
      - name: Compile and import current runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src
          python -c 'import multiseat_arch; import multiseat_arch.cli; import multiseat_arch.gui_current; import multiseat_arch.display_manager_current; import multiseat_arch.plasma_session_current; import multiseat_arch.sddm_greeter_bridge'
      - name: Run unit tests on Arch userspace
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
